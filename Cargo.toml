[workspace]
resolver = "3"
members = [
    "crates/packet-tools",
    "crates/packet-tools-capture",
    "crates/packet-tools-dissect",
    "crates/packet-tools-flow",
    "crates/packet-tools-reassembly",
    "crates/packet-tools-app",
    "crates/packet-tools-export",
    "crates/packet-tools-fixtures",
    "bench/rsbench",
]
exclude = ["bench/ptbench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akitenkrad/rs-packet-tools"
authors = ["akitenkrad"]

[workspace.dependencies]
ahash = "0.8.12"
arrow = { version = "60.0.0", default-features = false, features = ["csv"] }
clap = { version = "4.5.50", features = ["derive"] }
etherparse = "0.21.0"
flate2 = "1.1.5"
httparse = "1.10.1"
md-5 = "0.10.6"
memmap2 = "0.9.8"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
pcap-file = "2.0.0"
pcap-parser = "0.17.0"
packet-tools-capture = { path = "crates/packet-tools-capture", version = "0.1.0" }
packet-tools-dissect = { path = "crates/packet-tools-dissect", version = "0.1.0" }
packet-tools-flow = { path = "crates/packet-tools-flow", version = "0.1.0" }
packet-tools-reassembly = { path = "crates/packet-tools-reassembly", version = "0.1.0" }
packet-tools-app = { path = "crates/packet-tools-app", version = "0.1.0" }
packet-tools-export = { path = "crates/packet-tools-export", version = "0.1.0" }
proptest = "1.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
