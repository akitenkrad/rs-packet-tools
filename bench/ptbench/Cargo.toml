[package]
name = "ptbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
libc = "0.2.177"
runvault = { git = "https://github.com/akitenkrad/rs-runvault", branch = "main" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.23.0"
