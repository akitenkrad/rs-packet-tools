[package]
name = "packet-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Provides a unified library facade and command-line tools for packet capture analysis."
readme = "../../README.md"
keywords = ["pcap", "packet", "network", "forensics", "cli"]
categories = ["network-programming", "command-line-utilities", "parser-implementations"]
exclude = ["tests/"]

[dependencies]
clap.workspace = true
packet-tools-app.workspace = true
packet-tools-capture.workspace = true
packet-tools-dissect.workspace = true
packet-tools-export.workspace = true
packet-tools-flow.workspace = true
packet-tools-reassembly.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "packet-tools"
path = "src/main.rs"
