<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">packet-tools — parallel PCAP analysis in Rust</title>
  <desc id="hero-desc">Multiple capture files run through independent dissection, flow and TCP reassembly, and application parsing pipelines with jobs, producing Parquet or CSV tables.</desc>
  <style>
    .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 650; letter-spacing: 1.8px; fill: #534AB7; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; fill: #343431; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #5F5E5A; }
    .stage-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9px; font-weight: 650; letter-spacing: 0.45px; text-anchor: middle; fill: #5F5E5A; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; text-anchor: middle; fill: #5F5E5A; }
    .mini { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 650; text-anchor: middle; fill: #5F5E5A; }
    .mini-light { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 700; text-anchor: middle; fill: #FFFFFF; }
    .gray-fill { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
    .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
    .purple-solid { fill: #534AB7; stroke: #534AB7; stroke-width: 1; }
    .teal-fill { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .line-gray { fill: none; stroke: #5F5E5A; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .line-purple { fill: none; stroke: #534AB7; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .line-teal { fill: none; stroke: #0F6E56; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .arrow-gray { fill: none; stroke: #5F5E5A; stroke-width: 1.2; stroke-linecap: round; }
    .arrow-gray-head { fill: none; stroke: #5F5E5A; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .arrow-teal { fill: none; stroke: #0F6E56; stroke-width: 1.4; stroke-linecap: round; }
    .arrow-teal-head { fill: none; stroke: #0F6E56; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .guide { stroke: #D3D1C9; stroke-width: 1; stroke-dasharray: 2 5; }
    @media (prefers-color-scheme: dark) {
      .eyebrow { fill: #AFA9EC; }
      .title { fill: #E5E5E2; }
      .subtitle, .stage-label, .note, .mini { fill: #C7C5BD; }
      .gray-fill { fill: #444441; stroke: #B4B2A9; }
      .purple-fill { fill: #3C3489; stroke: #AFA9EC; }
      .purple-solid { fill: #534AB7; stroke: #AFA9EC; }
      .teal-fill { fill: #085041; stroke: #5DCAA5; }
      .line-gray, .arrow-gray, .arrow-gray-head { stroke: #B4B2A9; }
      .line-purple { stroke: #AFA9EC; }
      .line-teal, .arrow-teal, .arrow-teal-head { stroke: #5DCAA5; }
      .guide { stroke: #5F5E5A; }
    }
  </style>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow-gray-head" d="M2 1L8 5L2 9"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow-teal-head" d="M2 1L8 5L2 9"/>
    </marker>
  </defs>

  <text class="eyebrow" x="44" y="86">RUST · OFFLINE TRAFFIC ANALYSIS</text>
  <text class="title" x="42" y="129">packet-tools</text>
  <text class="subtitle" x="44" y="157">Fast PCAP analysis in Rust</text>
  <path class="line-teal" d="M44 178H272"/>
  <text class="subtitle" x="44" y="202">Packets · flows · applications</text>
  <text class="subtitle" x="44" y="224">Parquet + CSV</text>

  <line class="guide" x1="315" y1="216" x2="868" y2="216"/>

  <!-- Connectors are drawn before nodes. -->
  <path class="line-purple" d="M369 48V57H319V178"/>
  <path class="line-purple" d="M319 78H331M319 128H331M319 178H331"/>

  <path class="arrow-gray" d="M389 78H408" marker-end="url(#arrow-gray)"/>
  <path class="arrow-gray" d="M468 78H487" marker-end="url(#arrow-gray)"/>
  <path class="arrow-gray" d="M561 78H572" marker-end="url(#arrow-gray)"/>
  <path class="arrow-teal" d="M664 78H677" marker-end="url(#arrow-teal)"/>

  <path class="arrow-gray" d="M389 128H408" marker-end="url(#arrow-gray)"/>
  <path class="arrow-gray" d="M468 128H487" marker-end="url(#arrow-gray)"/>
  <path class="arrow-gray" d="M561 128H572" marker-end="url(#arrow-gray)"/>
  <path class="arrow-teal" d="M664 128H677" marker-end="url(#arrow-teal)"/>

  <path class="arrow-gray" d="M389 178H408" marker-end="url(#arrow-gray)"/>
  <path class="arrow-gray" d="M468 178H487" marker-end="url(#arrow-gray)"/>
  <path class="arrow-gray" d="M561 178H572" marker-end="url(#arrow-gray)"/>
  <path class="arrow-teal" d="M664 178H677" marker-end="url(#arrow-teal)"/>

  <!-- File-level parallel control. -->
  <g aria-label="Process capture files concurrently with jobs">
    <rect class="purple-solid" x="331" y="24" width="76" height="24" rx="12"/>
    <text class="mini-light" x="369" y="39">--jobs N</text>
    <text class="eyebrow" x="421" y="40">FILE-PARALLEL</text>
  </g>

  <!-- Independent per-file pipelines. -->
  <g aria-label="Three capture files enter independent processing pipelines">
    <rect class="purple-fill" x="331" y="62" width="58" height="32" rx="5"/>
    <rect class="purple-fill" x="331" y="112" width="58" height="32" rx="5"/>
    <rect class="purple-fill" x="331" y="162" width="58" height="32" rx="5"/>
    <text class="mini" x="360" y="81">.pcap</text>
    <text class="mini" x="360" y="131">.pcapng</text>
    <text class="mini" x="360" y="181">.gz</text>

    <rect class="gray-fill" x="410" y="62" width="58" height="32" rx="5"/>
    <rect class="gray-fill" x="410" y="112" width="58" height="32" rx="5"/>
    <rect class="gray-fill" x="410" y="162" width="58" height="32" rx="5"/>
    <text class="mini" x="439" y="81">L2–L4</text>
    <text class="mini" x="439" y="131">L2–L4</text>
    <text class="mini" x="439" y="181">L2–L4</text>

    <rect class="gray-fill" x="489" y="62" width="72" height="32" rx="5"/>
    <rect class="gray-fill" x="489" y="112" width="72" height="32" rx="5"/>
    <rect class="gray-fill" x="489" y="162" width="72" height="32" rx="5"/>
    <text class="mini" x="525" y="76">FLOWS</text>
    <text class="mini" x="525" y="87">+ TCP</text>
    <text class="mini" x="525" y="126">FLOWS</text>
    <text class="mini" x="525" y="137">+ TCP</text>
    <text class="mini" x="525" y="176">FLOWS</text>
    <text class="mini" x="525" y="187">+ TCP</text>

    <rect class="gray-fill" x="574" y="62" width="90" height="32" rx="5"/>
    <rect class="gray-fill" x="574" y="112" width="90" height="32" rx="5"/>
    <rect class="gray-fill" x="574" y="162" width="90" height="32" rx="5"/>
    <text class="mini" x="619" y="76">APP LAYER</text>
    <text class="mini" x="619" y="87">DNS · HTTP · TLS</text>
    <text class="mini" x="619" y="126">APP LAYER</text>
    <text class="mini" x="619" y="137">DNS · HTTP · TLS</text>
    <text class="mini" x="619" y="176">APP LAYER</text>
    <text class="mini" x="619" y="187">DNS · HTTP · TLS</text>

    <rect class="teal-fill" x="679" y="62" width="102" height="32" rx="5"/>
    <rect class="teal-fill" x="679" y="112" width="102" height="32" rx="5"/>
    <rect class="teal-fill" x="679" y="162" width="102" height="32" rx="5"/>
    <text class="mini" x="730" y="81">PARQUET / CSV</text>
    <text class="mini" x="730" y="131">PARQUET / CSV</text>
    <text class="mini" x="730" y="181">PARQUET / CSV</text>
  </g>

  <text class="stage-label" x="360" y="233">CAPTURE</text>
  <text class="stage-label" x="439" y="233">DISSECT</text>
  <text class="stage-label" x="525" y="233">FLOW + REASSEMBLY</text>
  <text class="stage-label" x="619" y="233">APPLICATION</text>
  <text class="stage-label" x="730" y="233">TABLES</text>
  <text class="note" x="556" y="257">Independent per-file pipelines · identical to single-file output</text>
</svg>
