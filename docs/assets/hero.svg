<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">packet-tools — Fast PCAP analysis in Rust</title>
  <desc id="hero-desc">Capture files flow through zero-copy protocol dissection, bidirectional flows and TCP reassembly, application parsing, and into Parquet tables.</desc>
  <style>
    .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 650; letter-spacing: 1.8px; fill: #534AB7; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; fill: #343431; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #5F5E5A; }
    .stage-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 650; letter-spacing: 0.5px; text-anchor: middle; fill: #5F5E5A; }
    .mini { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 650; text-anchor: middle; fill: #5F5E5A; }
    .mini-light { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 700; text-anchor: middle; fill: #FFFFFF; }
    .gray-fill { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
    .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
    .purple-solid { fill: #534AB7; stroke: #534AB7; stroke-width: 1; }
    .teal-fill { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .teal-solid { fill: #0F6E56; stroke: #0F6E56; stroke-width: 1; }
    .line-gray { fill: none; stroke: #5F5E5A; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .line-purple { fill: none; stroke: #534AB7; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .line-teal { fill: none; stroke: #0F6E56; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #534AB7; stroke-width: 1.5; stroke-linecap: round; }
    .arrow-head { fill: none; stroke: #534AB7; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .guide { stroke: #D3D1C9; stroke-width: 1; stroke-dasharray: 2 5; }
    @media (prefers-color-scheme: dark) {
      .eyebrow { fill: #AFA9EC; }
      .title { fill: #E5E5E2; }
      .subtitle, .stage-label, .mini { fill: #C7C5BD; }
      .gray-fill { fill: #32322F; stroke: #8C8B85; }
      .purple-fill { fill: #3D3973; stroke: #AFA9EC; }
      .purple-solid { fill: #534AB7; stroke: #AFA9EC; }
      .teal-fill { fill: #174D40; stroke: #5DCAA5; }
      .teal-solid { fill: #0F6E56; stroke: #5DCAA5; }
      .line-gray { stroke: #C7C5BD; }
      .line-purple, .arrow, .arrow-head { stroke: #AFA9EC; }
      .line-teal { stroke: #5DCAA5; }
      .guide { stroke: #5F5E5A; }
    }
  </style>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow-head" d="M2 1L8 5L2 9"/>
    </marker>
  </defs>

  <text class="eyebrow" x="44" y="89">RUST · OFFLINE TRAFFIC ANALYSIS</text>
  <text class="title" x="42" y="132">packet-tools</text>
  <text class="subtitle" x="44" y="160">Fast PCAP analysis in Rust</text>
  <path class="line-teal" d="M44 181H268"/>
  <text class="subtitle" x="44" y="205">Packets · flows · applications · Parquet</text>

  <line class="guide" x1="333" y1="184" x2="866" y2="184"/>

  <!-- Capture files -->
  <g aria-label="PCAP, pcapng, and gzip capture files">
    <rect class="gray-fill" x="336" y="78" width="58" height="72" rx="5"/>
    <path class="line-gray" d="M381 78V91H394"/>
    <rect class="teal-fill" x="344" y="87" width="58" height="72" rx="5"/>
    <path class="line-teal" d="M389 87V100H402"/>
    <rect class="purple-fill" x="352" y="96" width="58" height="72" rx="5"/>
    <path class="line-purple" d="M397 96V109H410"/>
    <text class="mini" x="381" y="125">pcap</text>
    <text class="mini" x="381" y="139">pcapng</text>
    <text class="mini" x="381" y="153">.gz</text>
    <text class="stage-label" x="373" y="205">CAPTURE</text>
  </g>

  <path class="arrow" d="M418 132H442" marker-end="url(#arrow-accent)"/>

  <!-- Zero-copy dissection -->
  <g aria-label="Zero-copy L2, L3, and L4 dissection">
    <rect class="gray-fill" x="451" y="132" width="70" height="32" rx="5"/>
    <rect class="teal-fill" x="457" y="109" width="70" height="32" rx="5"/>
    <rect class="purple-fill" x="463" y="86" width="70" height="32" rx="5"/>
    <text class="mini" x="486" y="152">L2</text>
    <text class="mini" x="492" y="129">L3</text>
    <text class="mini" x="498" y="106">L4</text>
    <text class="stage-label" x="492" y="197">ZERO-COPY</text>
    <text class="stage-label" x="492" y="210">DISSECT</text>
  </g>

  <path class="arrow" d="M539 132H559" marker-end="url(#arrow-accent)"/>

  <!-- Flows and TCP reassembly -->
  <g aria-label="Bidirectional flows and TCP stream reassembly">
    <circle class="teal-solid" cx="577" cy="103" r="5"/>
    <circle class="purple-solid" cx="632" cy="103" r="5"/>
    <path class="line-teal" d="M582 100C596 87 613 87 627 100" marker-end="url(#arrow-accent)"/>
    <path class="line-purple" d="M627 108C613 121 596 121 582 108" marker-end="url(#arrow-accent)"/>
    <rect class="gray-fill" x="574" y="132" width="62" height="28" rx="5"/>
    <path class="line-gray" d="M584 142H595M598 142H609M612 142H626M584 150H601M604 150H626"/>
    <text class="mini" x="605" y="176">TCP</text>
    <text class="stage-label" x="605" y="197">FLOWS +</text>
    <text class="stage-label" x="605" y="210">REASSEMBLY</text>
  </g>

  <path class="arrow" d="M645 132H665" marker-end="url(#arrow-accent)"/>

  <!-- Application layer -->
  <g aria-label="DNS, HTTP, and TLS application parsing">
    <rect class="teal-fill" x="674" y="88" width="70" height="24" rx="12"/>
    <rect class="purple-fill" x="674" y="119" width="70" height="24" rx="12"/>
    <rect class="gray-fill" x="674" y="150" width="70" height="24" rx="12"/>
    <text class="mini" x="709" y="103">DNS</text>
    <text class="mini" x="709" y="134">HTTP</text>
    <text class="mini" x="709" y="165">TLS</text>
    <text class="stage-label" x="709" y="205">APP LAYER</text>
  </g>

  <path class="arrow" d="M752 132H772" marker-end="url(#arrow-accent)"/>

  <!-- Parquet tables -->
  <g aria-label="Parquet table output">
    <rect class="teal-fill" x="781" y="88" width="76" height="83" rx="6"/>
    <rect class="teal-solid" x="781" y="88" width="76" height="22" rx="6"/>
    <path class="line-teal" d="M781 110H857M781 130H857M781 150H857M807 110V171M832 110V171"/>
    <text class="mini-light" x="819" y="102">PARQUET</text>
    <text class="stage-label" x="819" y="205">TABLES</text>
  </g>
</svg>
