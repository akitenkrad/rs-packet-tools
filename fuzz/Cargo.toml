[package]
name = "packet-tools-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
packet-tools-capture = { path = "../crates/packet-tools-capture" }
packet-tools-dissect = { path = "../crates/packet-tools-dissect" }
packet-tools-flow = { path = "../crates/packet-tools-flow" }
packet-tools-app = { path = "../crates/packet-tools-app" }
packet-tools-reassembly = { path = "../crates/packet-tools-reassembly" }

[[bin]]
name = "dissect"
path = "fuzz_targets/dissect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capture"
path = "fuzz_targets/capture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flow"
path = "fuzz_targets/flow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembly"
path = "fuzz_targets/reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app"
path = "fuzz_targets/app.rs"
test = false
doc = false
bench = false

[workspace]
